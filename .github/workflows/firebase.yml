name: Firebase 서버 배포

on:
  push:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    needs: check
    # 기본 브랜치이고, 배포용 Secret 이 설정돼 있을 때만 배포한다.
    if: github.ref_name == github.event.repository.default_branch && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 배포
        run: npx --yes firebase-tools@latest deploy --only functions,firestore,storage --project "${{ vars.FIREBASE_PROJECT_ID }}" --force --non-interactive
