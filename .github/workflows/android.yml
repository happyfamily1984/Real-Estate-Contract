name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/ci/**"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Firebase 설정 파일. 저장소 Secret GOOGLE_SERVICES_JSON 에 파일 내용을 그대로 붙여 넣는다.
      # 없으면 빌드 확인용 가짜 파일을 써서 컴파일만 검사한다 (이 APK 는 로그인 불가).
      - name: google-services.json 준비
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret 이 없어 가짜 설정으로 빌드합니다. 이 APK 는 실제로 동작하지 않습니다."
            cp ../.github/ci/google-services.placeholder.json app/google-services.json
            echo "CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: APK 빌드
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: APK 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk ../contract-app-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: contract-app-${{ github.run_number }}
          path: contract-app-${{ github.run_number }}.apk

      # main 브랜치에 올라가면 Releases 페이지에 APK 를 올린다. 휴대폰에서 바로 받아 설치하면 된다.
      - name: GitHub Release 에 APK 게시
        if: github.ref == 'refs/heads/main' && env.CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: 계약서함 앱 v1.0.${{ github.run_number }}
          body: 휴대폰에서 아래 APK 파일을 눌러 설치하세요.
          files: contract-app-${{ github.run_number }}.apk
